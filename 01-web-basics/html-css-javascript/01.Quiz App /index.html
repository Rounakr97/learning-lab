<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quiz app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- start screen -->
        <div class="screen active " id="start-screen">
           <h1>Quiz time</h1>
           <p>Test your Knowledge with these fun questions</p>
           <button id="start-btn"> Start Quiz</button>
        </div>
        <!-- quiz card -->
         <div class="screen" id="quiz-screen">
            <div class="quiz-header">
                <h2 id="question" class="question">question</h2>
                <div class="quiz-info">
                    <p>Question <span id="current-question">0</span> of <span id="total-questions">0</span>
                    </p>
                    <p>Score: <span id="score">0</span></p>
                </div>
                <!-- answer-container -->
                <div id="answers-container" class="answers-container">
                    <!-- here will be the options -->
                     <button class="answer-btn">answer-btn</button>
                </div>
                <!-- progress bar -->
                <div class="progress-bar">
                    <div id="progress" class="progress">
    
                    </div>
                </div>
            </div>
            </div>
        <!-- result screen -->
         <div class="screen" id="result-screen">
            <div class="result">
            <h1 class="quiz-result">Quiz Results</h1>
            <div class="result-info">
                <p>You Scored <span id="final-score">0 </span>out of <span id="max-score">0</span></p>
                <p id="result-msg">good job.</p>
            </div>
            <button id="restart-btn">Restart quiz</button>
    

        </div>
     </div>
        
      <script src="script.js"></script>
</body>
</html>
